# Ported as-is from https://github.com/cetanu/dotfiles — it's OS-agnostic.
add_newline = false
format = """
$time\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$cmd_duration\
\n$character
"""

[package]
disabled = true

[line_break]
disabled = false

[time]
disabled = true
format = "[$time]($style)|"

[cmd_duration]
format = "[$duration]($style) "
