# tmux-sessionizer config (bash syntax, sourced by bin/tmux-sessionizer).
# Symlinked to ~/.config/tmux-sessionizer/tmux-sessionizer.conf by setup.sh.
# Each path is searched to depth 1 unless suffixed with :N.
TS_SEARCH_PATHS=(~/ ~/codebase)
# Sub-projects inside a repo (e.g. agentic-ai-course/rag).
TS_EXTRA_SEARCH_PATHS=(~/codebase/agentic-ai-course)
