# tmux config — originally sourced from https://github.com/iamsg97/dotfiles, tuned for speed and navigation.
# Prefix stays the default: Ctrl + b

# --- Performance ---------------------------------------------------------
# Default 500ms escape-time makes <Esc> feel laggy inside tmux (e.g. in vim).
set -sg escape-time 10
set -g repeat-time 300
set -g focus-events on
set -g aggressive-resize on

# True color support so terminal apps and colorschemes render correctly.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- General --------------------------------------------------------------
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g mode-keys vi
set -g display-time 2000
set -g display-panes-time 2000

# --- Splits (new pane opens in the current pane's path) -------------------
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane navigation --------------------------------------------------------
# Ctrl + arrow keys, no prefix needed
bind-key -n C-Left select-pane -L
bind-key -n C-Right select-pane -R
bind-key -n C-Up select-pane -U
bind-key -n C-Down select-pane -D

# vi-style, with prefix (repeatable: prefix + h, then just h/j/k/l)
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# Resize panes with prefix + Shift-HJKL (repeatable)
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# --- Window navigation ------------------------------------------------------
# Alt + arrow keys, no prefix needed
bind-key -n M-Left previous-window
bind-key -n M-Right next-window

# --- Copy mode (vi keys) ---------------------------------------------------
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Reload config with prefix + r
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded"

# --- Look and feel (dark, low-contrast — everforest palette) ---
set -g status-style "bg=#2d353b,fg=#d3c6aa"
set -g status-left "#[fg=#a7c080,bold] #S #[default]"
set -g status-right "#[fg=#83c092]%Y-%m-%d #[fg=#dbbc7f]%H:%M "
set -g window-status-current-style "fg=#e69875,bold"
set -g pane-border-style "fg=#4f585e"
set -g pane-active-border-style "fg=#a7c080"
